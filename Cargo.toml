[package]
name = "rusty-math-tutor"
version = "0.5.0"
edition = "2021"
description = "A math tutor (K-8) that works on a plain old text console, graphical consoles and web assembly with pleasing random transitions between problems"
license = "GPL-3.0"

[[bin]]
name = "tutor"
path = "src/main.rs"

[lib]
name = "rusty_math_tutor"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
test = false

[features]
default = ["gui"]
gui = ["dep:winit", "dep:softbuffer", "dep:tiny-skia", "dep:font8x8", "dep:ab_glyph"]

[dependencies]
rand       = "0.8"
anyhow     = "1"
web-time   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui    = "0.29"
crossterm  = "0.28"
winit      = { version = "0.30", optional = true }
softbuffer = { version = "0.4",  optional = true }
tiny-skia  = { version = "0.11", optional = true }
font8x8    = { version = "0.3",  optional = true }
ab_glyph   = { version = "0.2",  optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen             = "0.2"
js-sys                   = "0.3"
console_error_panic_hook = "0.1"
getrandom  = { version = "0.2", features = ["js"] }
web-sys    = { version = "0.3", features = [
  "Window",
  "Storage",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
] }
tiny-skia  = "0.11"
font8x8    = "0.3"
ab_glyph   = "0.2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
