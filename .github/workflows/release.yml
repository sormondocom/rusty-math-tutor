# Builds ready-to-run executables so people don't have to compile from source.
#
# - Publish a GitHub Release from a tag (Releases -> "Draft a new release" ->
#   pick/create a tag like `v0.1.0` -> Publish) and this builds the binaries and
#   attaches them to that release automatically.
# - Or run it by hand from the Actions tab ("Run workflow") to just get the
#   binaries as downloadable build artifacts (no release upload).
#
# Targets:
#   - Windows (x86_64)            -> rusty-math-tutor-windows-x86_64.exe
#   - Chromebook / Linux (Intel)  -> rusty-math-tutor-linux-x86_64
#   - Chromebook / Linux (ARM)    -> rusty-math-tutor-linux-aarch64
#
# The Windows binary is the unified build: it boots into the console TUI and can
# open the CPU-graphics window from the startup picker.  The Linux builds are
# console-only (`--no-default-features`) and statically linked against musl, so
# they run inside a Chromebook's Linux (Crostini) container without any
# glibc-version (or windowing-library) surprises.

name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to upload assets onto the release

jobs:
  # Don't ship a broken build: the whole suite must pass first.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all

  build:
    name: Build (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the unified build (console TUI + CPU-graphics window).
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            bin: tutor.exe
            asset: rusty-math-tutor-windows-x86_64.exe
          # Chromebook / Linux: console-only, statically linked against musl.
          - label: chromebook-linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: "--no-default-features"
            bin: tutor
            asset: rusty-math-tutor-linux-x86_64
          - label: chromebook-linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: "--no-default-features"
            bin: tutor
            asset: rusty-math-tutor-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
